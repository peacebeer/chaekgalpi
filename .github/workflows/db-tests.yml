# DB 검사: 임시 Supabase DB에 마이그레이션을 적용하고 pgTAP으로 RLS·규칙을 확인한다.
name: DB tests

# 필수 검사로 지정할 수 있도록 모든 PR에서 실행한다(경로 필터를 걸면 대기 상태로 멈춘다).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pgtap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local database (applies supabase/migrations)
        run: supabase db start
      - name: Run pgTAP tests (supabase/tests/database)
        run: supabase test db
